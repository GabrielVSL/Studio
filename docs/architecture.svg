<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 315" width="100%" fill="none" role="img" aria-label="Arquitetura simplificada do studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0E0E13"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#71717A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FE3131"/>
    </marker>
    <clipPath id="clip">
      <rect x="1" y="1" width="1118" height="313" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <rect x="0" y="0" width="1120" height="315" fill="url(#bg)"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="1120" height="48" fill="#121218"/>
    <line x1="0" y1="48" x2="1120" y2="48" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="30" cy="24" r="4.5" fill="#FE3131"/>
    <text x="44" y="28.5" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.6">ARQUITETURA — FLUXO PRINCIPAL</text>
    <text x="1090" y="28.5" text-anchor="end" fill="#71717A" font-size="11" font-weight="500">Same-Origin BFF • Chaves 100% Server-Side</text>

    <!-- CARD 1: FRONTEND SPA -->
    <g transform="translate(36, 78)">
      <rect x="0" y="0" width="218" height="148" rx="14" fill="#111622" stroke="#38BDF8" stroke-opacity="0.45"/>
      <rect x="16" y="16" width="8" height="8" rx="2.5" fill="#38BDF8"/>
      <text x="32" y="24" fill="#7DD3FC" font-size="10.5" font-weight="700" letter-spacing="0.8">FRONTEND SPA</text>
      <text x="16" y="52" fill="#FFFFFF" font-size="16" font-weight="700">React 19 + Vite 8</text>
      <text x="16" y="78" fill="#A1A1AA" font-size="12">• Tailwind v4 &amp; Cache LRU</text>
      <text x="16" y="99" fill="#A1A1AA" font-size="12">• Player YouTube único</text>
      <text x="16" y="120" fill="#7DD3FC" font-size="11.5" font-weight="600">• Zero chaves no bundle</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="254" y1="152" x2="298" y2="152" stroke="#71717A" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="276" y="142" text-anchor="middle" fill="#A1A1AA" font-size="10" font-weight="600">/api/*</text>

    <!-- CARD 2: VERCEL EDGE -->
    <g transform="translate(302, 78)">
      <rect x="0" y="0" width="218" height="148" rx="14" fill="#151222" stroke="#A78BFA" stroke-opacity="0.45"/>
      <rect x="16" y="16" width="8" height="8" rx="2.5" fill="#A78BFA"/>
      <text x="32" y="24" fill="#C4B5FD" font-size="10.5" font-weight="700" letter-spacing="0.8">BORDA &amp; CDN</text>
      <text x="16" y="52" fill="#FFFFFF" font-size="16" font-weight="700">Vercel Edge</text>
      <text x="16" y="78" fill="#A1A1AA" font-size="12">• Headers CSP &amp; HSTS</text>
      <text x="16" y="99" fill="#A1A1AA" font-size="12">• Edge Cache (s-maxage)</text>
      <text x="16" y="120" fill="#C4B5FD" font-size="11.5" font-weight="600">• Rewrites SPA + API</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="520" y1="152" x2="564" y2="152" stroke="#FE3131" stroke-width="1.8" marker-end="url(#arrRed)"/>
    <text x="542" y="142" text-anchor="middle" fill="#FCA5A5" font-size="10" font-weight="600">BFF</text>

    <!-- CARD 3: EXPRESS 5 BFF -->
    <g transform="translate(568, 78)">
      <rect x="0" y="0" width="234" height="148" rx="14" fill="#1C1115" stroke="#FE3131" stroke-opacity="0.5"/>
      <rect x="16" y="16" width="8" height="8" rx="2.5" fill="#FE3131"/>
      <text x="32" y="24" fill="#FCA5A5" font-size="10.5" font-weight="700" letter-spacing="0.8">SERVERLESS API</text>
      <text x="16" y="52" fill="#FFFFFF" font-size="16" font-weight="700">Express 5 BFF</text>
      <text x="16" y="78" fill="#D4D4D8" font-size="12">• Rate Limit &amp; Anti-SSRF</text>
      <text x="16" y="99" fill="#D4D4D8" font-size="12">• Orquestração (Promise.all)</text>
      <text x="16" y="120" fill="#FCA5A5" font-size="11.5" font-weight="600">• Cache Watchmode 24h</text>
    </g>

    <!-- Split Arrows 3 -> 4A / 4B -->
    <path d="M 802 128 C 826 128, 826 112, 854 112" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 802 176 C 826 176, 826 192, 854 192" stroke="#34D399" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- CARD 4A: TMDB -->
    <g transform="translate(858, 78)">
      <rect x="0" y="0" width="226" height="68" rx="12" fill="#18150D" stroke="#FBBF24" stroke-opacity="0.45"/>
      <circle cx="20" cy="24" r="4" fill="#FBBF24"/>
      <text x="32" y="28.5" fill="#FDE68A" font-size="13.5" font-weight="700">TMDB API v3</text>
      <text x="16" y="51" fill="#A1A1AA" font-size="11.5">Catálogo, elenco &amp; trailers</text>
    </g>

    <!-- CARD 4B: WATCHMODE -->
    <g transform="translate(858, 158)">
      <rect x="0" y="0" width="226" height="68" rx="12" fill="#0E1915" stroke="#34D399" stroke-opacity="0.45"/>
      <circle cx="20" cy="24" r="4" fill="#34D399"/>
      <text x="32" y="28.5" fill="#A7F3D0" font-size="13.5" font-weight="700">Watchmode BR</text>
      <text x="16" y="51" fill="#A1A1AA" font-size="11.5">Deep-links &amp; ofertas grátis</text>
    </g>

    <!-- Bottom clean strip for direct Media CDNs -->
    <rect x="36" y="250" width="1048" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="560" y="273" text-anchor="middle" fill="#A1A1AA" font-size="12" font-weight="500">
      Mídia direta no navegador (sob CSP Allowlist):  <tspan fill="#E4E4E7" font-weight="600">image.tmdb.org</tspan> (pôsteres/backdrops w1280)  •  <tspan fill="#E4E4E7" font-weight="600">youtube-nocookie.com</tspan> (trailers)
    </text>
  </g>

  <rect x="1" y="1" width="1118" height="313" rx="18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
