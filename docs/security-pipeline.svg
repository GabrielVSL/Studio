<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" width="100%" fill="none" role="img" aria-label="Pipeline de Defesa em Profundidade da API studio">
  <defs>
    <linearGradient id="secBg" x1="0" y1="0" x2="1200" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0E0E13"/>
    </linearGradient>
    <marker id="secArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FE3131"/>
    </marker>
    <clipPath id="secClip">
      <rect x="1" y="1" width="1198" height="293" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#secClip)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <rect x="0" y="0" width="1200" height="295" fill="url(#secBg)"/>

    <!-- Header -->
    <rect x="0" y="0" width="1200" height="50" fill="#121218"/>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="32" cy="25" r="4.5" fill="#FE3131"/>
    <text x="46" y="29.5" fill="#FFFFFF" font-size="13.5" font-weight="700" letter-spacing="0.6">DEFESA EM PROFUNDIDADE — CICLO DE SEGURANÇA DE CADA REQUISIÇÃO</text>
    <text x="1166" y="29.5" text-anchor="end" fill="#71717A" font-size="11" font-weight="600">6 CAMADAS DE VALIDAÇÃO</text>

    <!-- Stage 1 -->
    <g transform="translate(36, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#13131A" stroke="#A78BFA" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#A78BFA" fill-opacity="0.18"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#DDD6FE" font-size="10.5" font-weight="700">01</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">Edge Headers</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• CSP Allowlist</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• HSTS (2 anos)</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• X-Frame: DENY</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• Permissions-Policy</text>
      <text x="12" y="146" fill="#C4B5FD" font-size="10" font-weight="600">vercel.json</text>
    </g>
    <line x1="208" y1="153" x2="225" y2="153" stroke="#FE3131" stroke-width="1.8" marker-end="url(#secArrow)"/>

    <!-- Stage 2 -->
    <g transform="translate(228, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#13131A" stroke="#38BDF8" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#38BDF8" fill-opacity="0.18"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#BAE6FD" font-size="10.5" font-weight="700">02</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">CORS &amp; Verbos</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• Somente GET/HEAD</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• Sem localhost Prod</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• Preview Regex</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• x-powered-by OFF</text>
      <text x="12" y="146" fill="#7DD3FC" font-size="10" font-weight="600">HTTP 405 se escrita</text>
    </g>
    <line x1="400" y1="153" x2="417" y2="153" stroke="#FE3131" stroke-width="1.8" marker-end="url(#secArrow)"/>

    <!-- Stage 3 -->
    <g transform="translate(420, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#13131A" stroke="#FBBF24" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#FBBF24" fill-opacity="0.18"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#FDE68A" font-size="10.5" font-weight="700">03</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">HPP &amp; Payload</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• Anti-HPP (arrays)</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• URL ≤ 512 chars</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• Anti-CRLF / Null</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• Zero body em GET</text>
      <text x="12" y="146" fill="#FDE68A" font-size="10" font-weight="600">HTTP 400 / 414</text>
    </g>
    <line x1="592" y1="153" x2="609" y2="153" stroke="#FE3131" stroke-width="1.8" marker-end="url(#secArrow)"/>

    <!-- Stage 4 -->
    <g transform="translate(612, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#181114" stroke="#FE3131" stroke-opacity="0.5"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#FE3131" fill-opacity="0.22"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#FCA5A5" font-size="10.5" font-weight="700">04</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">Dual Rate Limit</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• 120 req/min Global</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• 25 req/min Watch.</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• IP real (x-real-ip)</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• Cap FIFO 2000 IPs</text>
      <text x="12" y="146" fill="#FCA5A5" font-size="10" font-weight="600">HTTP 429 + Retry-After</text>
    </g>
    <line x1="784" y1="153" x2="801" y2="153" stroke="#FE3131" stroke-width="1.8" marker-end="url(#secArrow)"/>

    <!-- Stage 5 -->
    <g transform="translate(804, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#13131A" stroke="#FB923C" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#FB923C" fill-opacity="0.18"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#FED7AA" font-size="10.5" font-weight="700">05</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">Anti-SSRF Regex</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• IDs /^\d{1,10}$/</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• Anti Path Traversal</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• Allowlist de Sorts</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• Bloqueia IP privado</text>
      <text x="12" y="146" fill="#FED7AA" font-size="10" font-weight="600">isSafeHttpsUrl()</text>
    </g>
    <line x1="976" y1="153" x2="993" y2="153" stroke="#FE3131" stroke-width="1.8" marker-end="url(#secArrow)"/>

    <!-- Stage 6 -->
    <g transform="translate(996, 72)">
      <rect x="0" y="0" width="172" height="162" rx="12" fill="#0E1714" stroke="#34D399" stroke-opacity="0.45"/>
      <rect x="12" y="12" width="32" height="20" rx="6" fill="#34D399" fill-opacity="0.18"/>
      <text x="28" y="25.5" text-anchor="middle" fill="#A7F3D0" font-size="10.5" font-weight="700">06</text>
      <text x="52" y="25.5" fill="#FFFFFF" font-size="12" font-weight="700">Safe Upstream</text>
      <line x1="12" y1="42" x2="160" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="12" y="64" fill="#CBD5E1" font-size="11">• Chaves Server-Only</text>
      <text x="12" y="84" fill="#CBD5E1" font-size="11">• maxRedirects: 0</text>
      <text x="12" y="104" fill="#CBD5E1" font-size="11">• Timeout 7s–8s</text>
      <text x="12" y="124" fill="#CBD5E1" font-size="11">• Log sem api_key</text>
      <text x="12" y="146" fill="#6EE7B7" font-size="10" font-weight="600">Erro global opaco</text>
    </g>

    <!-- Bottom status bar -->
    <rect x="36" y="250" width="1132" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="602" y="268" text-anchor="middle" fill="#A1A1AA" font-size="11.5" font-weight="500">
      ✓  Handler global de erro sanitizado: nunca expõe stack traces, caminhos internos, variáveis de ambiente ou credenciais em respostas ou logs.
    </text>
  </g>

  <rect x="1" y="1" width="1198" height="293" rx="18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
