<!DOCTYPE html>
<html lang="pt-BR">
  <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Detalhes do Filme</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/public/css/detalhes.css" />
    </head>
    <body>
        <header>
            <div class="container">
                <div class="nav-logo">  
                    <img src="/public/images/homePage/logo.png" class="logo"/> <h1>PucFlix</h1>

                    <div class="nav-links">
                        <a href="index.html">Home</a>
                        <a href="explorer.html">Explorar</a>
                        <a href="#">Favoritos</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="content">
        <section class="movie-details">
            <div class="info">
                <div class="esquerda">
                    <img id="movie-poster" alt="Poster do Filme" width="300" height="450" />
                </div>

                <div class="direita">
                    <h2 id="movie-title">Título do Filme</h2>

                    <div class="movie-info">
                        <p><b>Ano de Lançamento:</b> <span id="release-year">2023</span></p>
                        <p><b>Gênero:</b> <span id="movie-genres">Ação, Aventura</span></p>
                        <p><b>Duração:</b> <span id="movie-runtime">120 minutos</span></p>
                        <p><b>Sinopse:</b> <span id="movie-overview">Esta é uma breve descrição do enredo do filme. Ela fornece uma visão geral da história e dos personagens principais.</span></p>
                    </div>

                    <section class="cast">
                        <h3>Elenco Principal:</h3>
                        <ul id="cast-list">
                            <!-- Elenco será inserido dinamicamente -->
                        </ul>
                    </section>
                </div>
            </div>

            <div class="rating">
                <i class="fas fa-star"></i>
                <span id="movie-rating">8.5/10</span>
            </div>

            <button class="action-button">Adicionar aos Favoritos</button>

            <!-- Outros Filmes (Trocar depois) -->
            <section class="filmes">
                <img src="/public/images/detalheSerie/169.png"/>
                <img src="/public/images/detalheSerie/169.png"/>
                <img src="/public/images/detalheSerie/169.png"/>
                <img src="/public/images/detalheSerie/169.png"/>
            </section>

        </section>
        </main>

        <!-- Inclusão do script -->
        <script src="/public/js/detalhes.js"></script>
    </body>
</html>
