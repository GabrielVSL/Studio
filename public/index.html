<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela 1 - Home-Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/info.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="nav-logo">  
                <a href="index.html">
                    <img src="/public/images/homePage/logo.png" class="logo"/> <h1>PucFlix</h1>
                </a>
                <div class="pesquisar">
                    <input type="text" id="search-input" placeholder="Pesquisar">
                    <button class="search-button" id="search-button">
                        <img src="/public/images/explorador/pesquisar.png" class="pesquisa">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Filmes Populares</h2>
        <div class="filmes" id="movies">
            <!-- Elementos gerados dinamicamente aqui -->
        </div>

        <section id="new-series" class="new-series">
            <h2>Novas Séries</h2>
            <div id="newSeries" class="newSeries">
                <!-- Elementos gerados dinamicamente aqui -->
            </div>
        </section>

        <section id="student-info" class="student-info">
            <div class="student-profile">

            <img class="student-image" src="/public/images/homePage/gabriel.jfif"/>

                <div class="student-details">
                    <h2 class="student-name">Gabriel Victor Souza Lopes</h2>
                    <p class="student-description">
                    Estudante de Engenharia de Software apaixonado por tecnologia e inovação. Sempre em busca de novos desafios e aprendizados.
                    </p>
                    <div class="social-links">
                    <a href="https://facebook.com"  class="social-icon">
                        <img src="/public/images/homePage/github.png" alt="">
                    </a>
                    <a href="https://linkedin.com"  class="social-icon">
                        <img src="/public/images/homePage/linkedin.png" alt="">
                    </a>
                    </div>
                    <div class="course-details">
                    <p class="course-name">Curso: Engenharia de Software</p>
                    <p class="course-class">Pontifícia Universidade Católica de Minas Gerais</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="my-series" class="my-series">
            <h2>Minhas Séries</h2>
            <div class="series-grid">
                <!-- Elementos gerados dinamicamente aqui -->
            </div>
        </section>
    </main>

    <!-- Barra de pesquisa -->
    <script src="/public/js/homePage/pesquisa.js"></script>
    <!-- Filmes populares -->
    <script src="/public/js/homePage/populares.js"></script>
    <!-- Novas Séries -->
    <script src="/public/js/homePage/newSeries.js"></script>
    <!-- Minhas Séries -->
    <script src="/public/js/homePage/favoritos.js"></script>
</body>
</html>
