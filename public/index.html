<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela 1 - Home-Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="/public/css/style.css" rel="stylesheet" />
</head>
<body>
    <header>
        <div class="container">
            <div class="nav-logo">  
                <a href="index.html">
                    <img src="/public/images/homePage/logo.png" class="logo"/> <h1>PucFlix</h1>
                </a>
                <div class="pesquisar">
                    <input type="text" id="search-input" placeholder="Pesquisar">
                    <button class="search-button" id="search-button">
                        <img src="/public/images/explorador/pesquisar.png" class="pesquisa">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Filmes Populares</h2>
        <div class="filmes" id="movies"></div>

        <section id="new-series" class="new-series">
            <h2>Novas Séries</h2>
            <div class="series-grid">
                <!-- Elementos gerados dinamicamente aqui -->
            </div>
        </section>

        <section id="student-info" class="student-info">
            <h2>Informações do Aluno</h2>
            <p>Este layout é personalizado e contém:</p>
            <ul>
                <li>Imagem</li>
                <li>Nome</li>
                <li>Mini bio</li>
                <li>Redes sociais</li>
                <li>Curso e turma</li>
            </ul>
        </section>

        <section id="my-series" class="my-series">
            <h2>Minhas Séries</h2>
            <div class="series-grid">
                <!-- Aqui, adicione uma estrutura para as séries geradas dinamicamente -->
            </div>
        </section>
    </main>

    <!-- Corrigido o caminho do script para o arquivo correto -->
    <script src="/public/js/homePage/pesquisa.js"></script>
    <!-- Corrigido o caminho do arquivo do explorer -->
    <script src="/public/js/explorer/explorer.js"></script>
</body>
</html>
